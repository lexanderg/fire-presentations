<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__DECK_TITLE__</title>

<!-- FONT IMPORT: replace with the preset's Google Fonts <link> from styles.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- __FONT_LINK__ -->

<style>
  /* ============ THEME VARIABLES ============ */
  /* Paste the chosen preset's :root block from styles.md HERE */
  :root {
    /* __PRESET_ROOT__ */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    height: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============ DECK CONTAINER ============ */
  .deck {
    height: 100dvh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .slide {
    height: 100dvh;
    scroll-snap-align: start;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(40px, 6vh, 80px) clamp(60px, 8vw, 120px);
    isolation: isolate;
    opacity: 0;
    transform: translateY(20px);
    transition:
      opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .slide.visible { opacity: 1; transform: none; }

  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition:
      opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .slide.visible .reveal { opacity: 1; transform: none; }
  .slide.visible .reveal:nth-child(1) { transition-delay: 0.1s; }
  .slide.visible .reveal:nth-child(2) { transition-delay: 0.2s; }
  .slide.visible .reveal:nth-child(3) { transition-delay: 0.3s; }
  .slide.visible .reveal:nth-child(4) { transition-delay: 0.4s; }
  .slide.visible .reveal:nth-child(5) { transition-delay: 0.5s; }
  .slide.visible .reveal:nth-child(6) { transition-delay: 0.6s; }

  @media (prefers-reduced-motion: reduce) {
    .slide, .reveal {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
  }

  /* ============ SHARED TYPOGRAPHY ============ */
  .slide__display {
    font-family: var(--font-display);
    font-size: clamp(48px, 9vw, 120px);
    font-weight: var(--display-weight, 800);
    letter-spacing: var(--letter-tight, -2px);
    line-height: 0.98;
    text-wrap: balance;
  }

  .slide__heading {
    font-family: var(--font-display);
    font-size: clamp(32px, 5.5vw, 72px);
    font-weight: var(--heading-weight, 700);
    letter-spacing: var(--letter-tight, -1px);
    line-height: 1.05;
    text-wrap: balance;
  }

  .slide__subheading,
  .slide__subtitle {
    font-family: var(--font-body);
    font-size: clamp(16px, 2vw, 22px);
    font-weight: var(--body-weight, 400);
    line-height: 1.55;
    color: var(--text-dim);
    max-width: 640px;
    margin-top: clamp(12px, 2vh, 24px);
    text-wrap: pretty;
  }

  .slide__label {
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.1vw, 13px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--accent);
    margin-bottom: clamp(14px, 2vh, 22px);
  }

  .slide__bullets {
    list-style: none;
    padding: 0;
    margin-top: clamp(16px, 3vh, 32px);
  }

  .slide__bullets li {
    position: relative;
    padding: 10px 0 10px 26px;
    font-size: clamp(16px, 1.9vw, 22px);
    line-height: 1.5;
    color: var(--text-dim);
  }

  .slide__bullets li::before {
    content: '';
    position: absolute;
    left: 0; top: 20px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .slide__caption {
    margin-top: clamp(16px, 3vh, 28px);
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.2vw, 13px);
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* ============ SLIDE TYPE: HERO ============ */
  .slide--hero,
  .slide--divider {
    background: var(--hero-bg);
    color: var(--hero-text, var(--text));
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .slide--hero .slide__display,
  .slide--divider .slide__display {
    color: var(--hero-text, var(--text));
  }

  .slide--hero .slide__subtitle,
  .slide--divider .slide__subtitle {
    color: color-mix(in srgb, var(--hero-text, var(--text)) 70%, transparent);
    margin-inline: auto;
  }

  .hero__eyebrow {
    font-family: var(--font-body);
    font-size: clamp(14px, 1.6vw, 18px);
    font-weight: 500;
    color: color-mix(in srgb, var(--hero-text, var(--text)) 85%, transparent);
    margin-bottom: clamp(32px, 5vh, 56px);
    letter-spacing: -0.2px;
  }

  .hero__meta {
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.1vw, 13px);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--hero-accent);
    margin-top: clamp(28px, 4vh, 48px);
  }

  .divider__tag {
    display: inline-block;
    background: color-mix(in srgb, var(--hero-text, var(--text)) 12%, transparent);
    color: var(--hero-accent);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: clamp(20px, 3vh, 36px);
  }

  /* ============ SLIDE TYPE: CARDS ============ */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: clamp(16px, 2vw, 32px);
    margin-top: clamp(32px, 5vh, 56px);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius, 12px);
    padding: clamp(24px, 3vh, 40px) clamp(20px, 2.5vw, 32px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card__title {
    font-family: var(--font-display);
    font-size: clamp(18px, 1.9vw, 22px);
    font-weight: var(--heading-weight, 700);
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .card__badge {
    align-self: flex-start;
    background: var(--accent);
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
  }

  .card__body {
    font-size: clamp(13px, 1.3vw, 15px);
    line-height: 1.55;
    color: var(--text-dim);
  }

  /* ============ SLIDE TYPE: SPLIT ============ */
  .split-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: clamp(24px, 3vw, 48px);
    align-items: center;
    margin-top: clamp(32px, 5vh, 56px);
  }

  .split-col {
    padding: clamp(20px, 3vh, 32px);
  }

  .split-col--b {
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: var(--radius, 12px);
  }

  .split__title {
    font-family: var(--font-display);
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: var(--heading-weight, 700);
    margin-bottom: 14px;
    color: var(--text);
  }

  .split-col--b .split__title { color: var(--accent); }

  .split__body {
    font-size: clamp(14px, 1.5vw, 17px);
    line-height: 1.6;
    color: var(--text-dim);
  }

  .split-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: var(--accent);
  }

  .split__footer {
    margin-top: clamp(32px, 5vh, 48px);
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: var(--heading-weight, 700);
    color: var(--text);
  }

  /* ============ SLIDE TYPE: QUOTE ============ */
  .slide--quote {
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: clamp(60px, 10vh, 120px) clamp(60px, 12vw, 200px);
  }

  .quote__mark {
    font-family: var(--font-display);
    font-size: clamp(80px, 14vw, 180px);
    line-height: 0.5;
    opacity: 0.08;
    color: var(--accent);
    margin-bottom: -20px;
  }

  .slide--quote blockquote {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 52px);
    font-weight: var(--heading-weight, 600);
    line-height: 1.3;
    font-style: italic;
    max-width: 900px;
  }

  .slide--quote cite {
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.3vw, 14px);
    font-style: normal;
    margin-top: clamp(20px, 3vh, 40px);
    display: block;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ============ SLIDE TYPE: DIAGRAM (flow) ============ */
  .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.5vw, 24px);
    margin-top: clamp(32px, 5vh, 56px);
    flex-wrap: wrap;
  }

  .flow__node {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius, 12px);
    padding: clamp(14px, 2vh, 24px) clamp(16px, 2vw, 28px);
    font-family: var(--font-display);
    font-weight: var(--heading-weight, 700);
    font-size: clamp(14px, 1.6vw, 18px);
    color: var(--text);
  }

  .flow__arrow {
    width: 32px;
    height: 16px;
    color: var(--accent);
    flex-shrink: 0;
  }

  /* ============ NAV CHROME ============ */
  .deck-dots {
    position: fixed;
    right: clamp(16px, 2vw, 28px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
  }

  .deck-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--text) 20%, transparent);
    border: none; padding: 0;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  body.current-hero .deck-dot {
    background: color-mix(in srgb, var(--hero-text, var(--text)) 25%, transparent);
  }
  .deck-dot:hover { opacity: 0.7; }
  .deck-dot.active {
    background: var(--accent) !important;
    transform: scale(1.4);
  }

  .deck-counter {
    position: fixed;
    bottom: clamp(16px, 2.5vh, 32px);
    left: clamp(40px, 5vw, 80px);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--text-dim);
    z-index: 100;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  body.current-hero .deck-counter {
    color: color-mix(in srgb, var(--hero-text, var(--text)) 50%, transparent);
  }

  .deck-hints {
    position: fixed;
    bottom: clamp(16px, 2.5vh, 32px);
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    opacity: 0.5;
    z-index: 100;
    transition: opacity 0.5s;
    white-space: nowrap;
  }
  .deck-hints.faded { opacity: 0; pointer-events: none; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 900px) {
    .slide { padding: 40px 24px; }
    .cards-grid { grid-template-columns: 1fr; }
    .split-grid { grid-template-columns: 1fr; }
    .split-divider { transform: rotate(90deg); margin: 16px auto; }
  }

  @media (max-height: 700px) {
    .slide__display { font-size: clamp(36px, 7vw, 72px); }
    .slide__heading { font-size: clamp(26px, 4.5vw, 48px); }
  }
</style>
</head>
<body>

<div class="deck">
  <!-- __SLIDES__ go here, one <section class="slide slide--TYPE"> per slide -->
</div>

<script>
  function SlideEngine() {
    this.deck = document.querySelector('.deck');
    this.slides = [].slice.call(document.querySelectorAll('.slide'));
    this.current = 0;
    this.total = this.slides.length;
    this.buildChrome();
    this.bindEvents();
    this.observe();
    this.update();
  }

  SlideEngine.prototype.buildChrome = function() {
    var dots = document.createElement('div');
    dots.className = 'deck-dots';
    var self = this;
    this.slides.forEach(function(_, i) {
      var d = document.createElement('button');
      d.className = 'deck-dot';
      d.setAttribute('aria-label', 'Slide ' + (i + 1));
      d.onclick = function() { self.goTo(i); };
      dots.appendChild(d);
    });
    document.body.appendChild(dots);
    this.dots = [].slice.call(dots.children);

    var ctr = document.createElement('div');
    ctr.className = 'deck-counter';
    document.body.appendChild(ctr);
    this.counter = ctr;

    var hints = document.createElement('div');
    hints.className = 'deck-hints';
    hints.textContent = '← → or scroll to navigate';
    document.body.appendChild(hints);
    this.hints = hints;
    this.hintTimer = setTimeout(function() { hints.classList.add('faded'); }, 4000);
  };

  SlideEngine.prototype.bindEvents = function() {
    var self = this;
    document.addEventListener('keydown', function(e) {
      if (e.target.closest('input,textarea,[contenteditable]')) return;
      if (['ArrowDown', 'ArrowRight', ' ', 'PageDown'].indexOf(e.key) > -1) {
        e.preventDefault(); self.next();
      } else if (['ArrowUp', 'ArrowLeft', 'PageUp'].indexOf(e.key) > -1) {
        e.preventDefault(); self.prev();
      } else if (e.key === 'Home') { e.preventDefault(); self.goTo(0); }
      else if (e.key === 'End') { e.preventDefault(); self.goTo(self.total - 1); }
      self.fadeHints();
    });
    var tY;
    this.deck.addEventListener('touchstart', function(e) { tY = e.touches[0].clientY; }, { passive: true });
    this.deck.addEventListener('touchend', function(e) {
      var dy = tY - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 50) { dy > 0 ? self.next() : self.prev(); }
    });
  };

  SlideEngine.prototype.observe = function() {
    var self = this;
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          self.current = self.slides.indexOf(entry.target);
          self.update();
        }
      });
    }, { threshold: 0.5 });
    this.slides.forEach(function(s) { obs.observe(s); });
  };

  SlideEngine.prototype.goTo = function(i) {
    this.slides[Math.max(0, Math.min(i, this.total - 1))].scrollIntoView({ behavior: 'smooth' });
  };
  SlideEngine.prototype.next = function() { if (this.current < this.total - 1) this.goTo(this.current + 1); };
  SlideEngine.prototype.prev = function() { if (this.current > 0) this.goTo(this.current - 1); };

  SlideEngine.prototype.update = function() {
    var c = this.current;
    this.dots.forEach(function(d, i) { d.classList.toggle('active', i === c); });
    this.counter.textContent = (this.current + 1) + ' / ' + this.total;
    var slide = this.slides[c];
    var isHero = slide.classList.contains('slide--hero') || slide.classList.contains('slide--divider');
    document.body.classList.toggle('current-hero', isHero);
  };

  SlideEngine.prototype.fadeHints = function() {
    clearTimeout(this.hintTimer);
    this.hints.classList.add('faded');
  };

  document.addEventListener('DOMContentLoaded', function() { new SlideEngine(); });
</script>

</body>
</html>
